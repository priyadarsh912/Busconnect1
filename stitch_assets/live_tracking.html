<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BusConnect Live Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries" integrity="sha384-1DcZPGeODWbGGjS/i/n4ULX/pEc0DPcKK2WhyuWEmBXRfzOwoVTDQBN9C3C5jJHK" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006B7D",
                        "primary-container": "#0096B0",
                        "secondary": "#fc9d41",
                        "tertiary": "#008948",
                        "error": "#D32F2F",
                        "surface": "#f5f7fa",
                        "on-surface": "#191c1d",
                        "background": "#f5f7fa",
                        "outline-variant": "#c1c6d6",
                        "on-secondary-container": "#6b3900",
                        "on-secondary-fixed": "#2e1500",
                        "surface-bright": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#005229",
                        "secondary-fixed-dim": "#ffb77a",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#6d3a00",
                        "surface-container-low": "#f3f4f5",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "outline": "#727785",
                        "on-tertiary-fixed": "#00210d",
                        "tertiary-fixed": "#6cfe9f",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "inverse-primary": "#adc7ff",
                        "inverse-surface": "#2e3132",
                        "error-container": "#ffdad6",
                        "surface-tint": "#005bc0",
                        "primary-fixed-dim": "#adc7ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#414754",
                        "on-primary-fixed-variant": "#004493",
                        "surface-container-high": "#e7e8e9",
                        "secondary-fixed": "#ffdcc2"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(248, 249, 250, 0.8) 0%, rgba(248, 249, 250, 0) 20%, rgba(248, 249, 250, 0) 80%, rgba(248, 249, 250, 0.9) 100%);
        }
        .route-polyline {
            stroke-dasharray: 8;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface overflow-hidden">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="fixed top-0 w-full z-50 bg-slate-50/70 backdrop-blur-xl flex justify-between items-center px-6 py-4  shadow-[0_8px_32px_rgba(0,0,0,0.06)]">
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-slate-200/50 transition-colors active:scale-95" aria-label="Back">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-2xl tracking-tight bg-gradient-to-r from-primary to-primary-container bg-clip-text text-transparent">BusConnect</h1>
</div>
<div class="flex items-center gap-4">
<button type="button" class="material-symbols-outlined text-slate-500 hover:bg-slate-200/50 p-2 rounded-full transition-colors cursor-pointer" aria-label="Notifications">notifications</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary/20">
<img class="w-full h-full object-cover" alt="close up professional portrait of a smiling user with soft studio lighting and neutral background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDv4lz-1hRXWR5lEp0SLoaDRmghCa-17BAxHOAUWl0Wn2l5HptzquCQ5b8tu5eh9SboXKLMPB1CwJN2-M--PGrrj3udrM6puQeLadFb2Rst_d7Z3Cp5bB8mclfdelEC6dqI5yx6JolqHVX84t3ezuLMT06Uqn7wnRAdL0ThaPr8Ec3SBi0iDjkY8Ycfd5KCzqvsdYmmw8zI0W5fQeV5tIUfr9aykv8RYr13rvMp213_lcCpNivHFSBGv_WQSo5RgxxB99hyYYrILF6P"/>
</div>
</div>
</header>
<!-- Full Screen Map Canvas -->
<main class="relative h-screen w-full pt-16">
<div class="absolute inset-0 z-0">
<!-- Simulated Map Visual -->
<img class="w-full h-full object-cover grayscale opacity-40 brightness-110" alt="Detailed monochromatic city map with clean vector lines and subtle topological features in cool slate tones" data-location="New York City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeUxg4ya2-WX5Jze6crItcTJ3JQpfN8BznJZIPos-CWXu8Ea-r1tYcPTceFIVyC2yVmjbFtkMK5wuKC6FrHRWwH5gfdRtyune5oV66Pv-zW96Vqia4x7zAfNicVVXXY7gN4rCqWBN_fksXc0FL0SImBSBfj6g4Ybf6SngVj078qAMFp3O0MtfPydqNGwmILn_fVJDeZ_sqDYXG4ZLq8JQmb6Wjat1icyLCS-y3uuyrS57QjZbJylJhpqYk4u_3UFtXnXvVDWji9H0j"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
<!-- SVG Overlay for Route and Markers -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1000 1000">
<!-- Polyline Route -->
<path class="route-polyline" d="M 200,800 Q 400,750 500,500 T 800,200" fill="none" stroke="url(#routeGradient)" stroke-linecap="round" stroke-width="8"></path>
<defs>
<linearGradient id="routeGradient" x1="0%" x2="100%" y1="0%" y2="0%">
<stop offset="0%" style="stop-color:#006B7D;stop-opacity:1"></stop>
<stop offset="100%" style="stop-color:#0096B0;stop-opacity:1"></stop>
</linearGradient>
</defs>
<!-- Bus Marker -->
<g transform="translate(480, 520)">
<circle class="shadow-lg" fill="white" filter="url(#dropShadow)" r="24"></circle>
<circle fill="#006B7D" r="20"></circle>
<text fill="white" font-family="Material Symbols Outlined" font-size="24" x="-12" y="8">directions_bus</text>
<!-- Pulse effect -->
<circle fill="#006B7D" opacity="0.3" r="20">
<animate attributeName="r" dur="1.5s" from="20" repeatCount="indefinite" to="40"></animate>
<animate attributeName="opacity" dur="1.5s" from="0.3" repeatCount="indefinite" to="0"></animate>
</circle>
</g>
<filter height="130%" id="dropShadow">
<feGaussianBlur in="SourceAlpha" stdDeviation="3"></feGaussianBlur>
<feOffset dx="2" dy="2" result="offsetblur"></feOffset>
<feComponentTransfer>
<feFuncA slope="0.2" type="linear"></feFuncA>
</feComponentTransfer>
<feMerge>
<feMergeNode></feMergeNode>
<feMergeNode in="SourceGraphic"></feMergeNode>
</feMerge>
</filter>
</svg>
</div>
<!-- Floating Action Controls (Minimal Map UI) -->
<div class="absolute right-6 top-24 flex flex-col gap-4 z-20">
<button aria-label="Locate me" class="w-12 h-12 bg-surface-container-lowest shadow-xl rounded-full flex items-center justify-center text-on-surface hover:bg-slate-50 transition-all">
<span class="material-symbols-outlined">my_location</span>
</button>
<button aria-label="Toggle layers" class="w-12 h-12 bg-surface-container-lowest shadow-xl rounded-full flex items-center justify-center text-on-surface hover:bg-slate-50 transition-all">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
<!-- Floating Bottom Sheet -->
<div class="absolute bottom-0 left-0 w-full z-40 px-4 pb-safe-bottom pb-24 md:pb-12">
<div class="max-w-2xl mx-auto bg-white/90 backdrop-blur-2xl rounded-xl shadow-[0_-12px_40px_rgba(0,0,0,0.08)] border border-surface-container-high overflow-hidden">
<!-- Handle -->
<div class="w-full flex justify-center py-3">
<div class="w-12 h-1.5 bg-on-surface-variant/20 rounded-full"></div>
</div>
<div class="p-8 pt-2">
<div class="flex justify-between items-start mb-8">
<div class="space-y-1">
<div class="flex items-center gap-2 mb-2">
<span class="bg-primary/10 text-primary font-label font-semibold text-xs px-2 py-1 rounded-md tracking-wider">LIVE</span>
<div class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></div>
</div>
<h2 class="font-headline font-extrabold text-3xl tracking-tight text-on-surface">Bus 402 <span class="text-on-surface-variant font-medium">to Downtown</span></h2>
<p class="font-body text-on-surface-variant text-lg">Next Stop: <span class="font-semibold text-on-surface">Central Park</span></p>
</div>
<div class="text-right">
<p class="font-headline font-black text-5xl text-primary leading-none">4</p>
<p class="font-label font-bold text-xs uppercase tracking-widest text-primary mt-1">mins away</p>
</div>
</div>
<!-- Details Bento Grid Style -->
<div class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface p-5 rounded-lg flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-white shadow-sm border border-surface-container-high flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">person</span>
</div>
<div>
<p class="text-xs font-label text-on-surface-variant uppercase tracking-tighter">Capacity</p>
<p class="font-headline font-bold text-lg">Moderate</p>
</div>
</div>
<div class="bg-surface p-5 rounded-lg flex items-center gap-4">
<div class="w-12 h-12 rounded-full bg-white shadow-sm border border-surface-container-high flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined">wifi</span>
</div>
<div>
<p class="text-xs font-label text-on-surface-variant uppercase tracking-tighter">Connectivity</p>
<p class="font-headline font-bold text-lg">Free Wifi</p>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-5 rounded-full bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold text-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-3 transition-transform active:scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
                        Buy Ticket
                    </button>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (Mobile Context) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 bg-white/70 backdrop-blur-2xl rounded-t-[32px] z-50 shadow-[0_-8px_32px_rgba(0,0,0,0.04)] md:hidden">
<button aria-label="Home" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined">home</span>
<span class="font-label font-semibold text-[11px] uppercase tracking-wider mt-1">Home</span>
</button>
<button aria-label="Nearby" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined">near_me</span>
<span class="font-label font-semibold text-[11px] uppercase tracking-wider mt-1">Nearby</span>
</button>
<button aria-label="Routes" aria-current="page" class="flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-white rounded-full px-5 py-2 transition-all duration-300 active:scale-90">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
<span class="font-label font-semibold text-[11px] uppercase tracking-wider mt-1">Routes</span>
</button>
<button aria-label="Tickets" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-transform active:scale-90">
<span class="material-symbols-outlined">confirmation_number</span>
<span class="font-label font-semibold text-[11px] uppercase tracking-wider mt-1">Tickets</span>
</button>
</nav>
</body></html>
