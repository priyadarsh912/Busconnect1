<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .kinetic-pulse {
            box-shadow: 0 8px 32px rgba(0, 91, 191, 0.08);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col overflow-hidden">
<!-- Top Navigation (Contextual Suppression Logic: Hidden for Onboarding) -->
<main class="flex-1 relative flex flex-col px-8 pt-20 pb-12">
<!-- Visual Component: Bento-style Illustration Layout -->
<div class="flex-1 flex items-center justify-center mb-12 relative">
<!-- Background Atmospheric Elements -->
<div class="absolute w-64 h-64 bg-primary/10 rounded-full blur-[80px] -top-10 -left-10 animate-pulse"></div>
<div class="absolute w-48 h-48 bg-tertiary/10 rounded-full blur-[60px] bottom-0 -right-5"></div>
<div class="relative w-full max-w-sm aspect-[4/5] glass-card rounded-lg kinetic-pulse p-4 flex flex-col gap-4">
<!-- Digital Ticket Representation -->
<div class="flex-1 bg-white rounded-[24px] shadow-sm overflow-hidden flex flex-col">
<div class="bg-gradient-to-br from-primary to-tertiary-container p-6 text-white h-1/3">
<div class="flex justify-between items-start">
<div>
<p class="font-label text-[10px] uppercase tracking-widest opacity-80 mb-1">Route 402</p>
<h3 class="font-headline font-bold text-xl">Downtown Express</h3>
</div>
<span class="material-symbols-outlined text-3xl">directions_bus</span>
</div>
</div>
<div class="flex-1 p-6 flex flex-col items-center justify-center relative">
<!-- Perforated Ticket Line Visual -->
<div class="absolute -top-[1px] left-0 w-full h-4 flex justify-between px-[-8px]">
<div class="w-4 h-4 rounded-full bg-surface-container-low -ml-2"></div>
<div class="w-4 h-4 rounded-full bg-surface-container-low -mr-2"></div>
</div>
<div class="w-40 h-40 bg-surface-container rounded-lg p-2 mb-4 border border-outline-variant/20 flex items-center justify-center">
<img alt="QR Code Ticket" class="w-full h-full object-contain mix-blend-multiply opacity-80" data-alt="Modern digital bus ticket QR code displayed on a clean white surface with minimal interface elements and soft shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6u69mc4SZHs9KtXtU27rbADSC_YfhcqoJma4w6vtJDr_8fz0ZpmAjwhkfDwkv-yWvo-JENKf7k22e0JR1J4l-C9ptntDLFRNDtx69VMGcoRPQKMJDyqKVSnZwrlcdkwHF1tGW7FiE3USXTVSyqBoZvWFT46_HuVGFyjn1zPMx5-vQSy_Bt7xJskVMyow1-PklKsEmsHbEWvPAR2wKF30bomjTq4xcNkgEnaebAIt-47H02t2E_aHn7aqRzMGUN_oVudUjb-TpLpYc"/>
</div>
<div class="text-center">
<p class="font-headline font-bold text-primary tracking-tight">SCAN TO BOARD</p>
<p class="font-label text-xs text-on-surface-variant mt-1">Passenger: Alex Murphy</p>
</div>
</div>
</div>
<!-- Floating Success Indicator -->
<div class="absolute -right-4 top-1/2 -translate-y-1/2 glass-card rounded-full p-4 kinetic-pulse border border-white/40">
<div class="w-12 h-12 bg-tertiary/10 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</div>
</div>
<!-- Content Section: Editorial Typography -->
<div class="z-10 flex flex-col gap-4">
<!-- Progress Bar -->
<div class="flex gap-1.5 mb-2">
<div class="h-1.5 w-6 rounded-full bg-surface-container-highest"></div>
<div class="h-1.5 w-12 rounded-full bg-primary"></div>
<div class="h-1.5 w-6 rounded-full bg-surface-container-highest"></div>
</div>
<div class="flex flex-col gap-4">
<h1 class="font-headline font-extrabold text-4xl tracking-tight leading-[1.1] text-on-surface">
                    Book tickets <span class="bg-gradient-to-br from-primary to-tertiary-container bg-clip-text text-transparent">instantly</span>
</h1>
<p class="font-body text-lg text-on-surface-variant leading-relaxed max-w-[90%]">
                    Skip the queue and secure your seat in seconds with easy digital payments.
                </p>
</div>
</div>
<!-- Action Section -->
<div class="mt-12 flex items-center justify-between">
<button class="font-label font-semibold text-on-surface-variant px-2 py-2 hover:text-primary transition-colors">
                Skip
            </button>
<button class="bg-gradient-to-br from-primary to-tertiary-container text-white px-10 py-5 rounded-full font-headline font-bold text-lg shadow-lg hover:shadow-xl hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-3">
                Next
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</main>
<!-- Bottom Navigation (Contextual Suppression Logic: Suppressed for Onboarding Flow) -->
</body></html>
