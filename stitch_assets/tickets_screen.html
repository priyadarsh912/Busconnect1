<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BusConnect - Tickets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#006B7D",
                        "primary-container": "#0096B0",
                        "secondary": "#fc9d41",
                        "tertiary": "#008948",
                        "error": "#D32F2F",
                        "surface": "#f5f7fa",
                        "on-surface": "#191c1d",
                        "background": "#f5f7fa",
                        "outline-variant": "#c1c6d6",
                        "on-secondary-container": "#6b3900",
                        "on-secondary-fixed": "#2e1500",
                        "surface-bright": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#005229",
                        "secondary-fixed-dim": "#ffb77a",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-variant": "#e1e3e4",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary-fixed-variant": "#6d3a00",
                        "surface-container-low": "#f3f4f5",
                        "on-background": "#191c1d",
                        "on-primary": "#ffffff",
                        "outline": "#727785",
                        "on-tertiary-fixed": "#00210d",
                        "tertiary-fixed": "#6cfe9f",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "on-secondary": "#ffffff",
                        "on-primary-fixed": "#001a41",
                        "surface-container": "#edeeef",
                        "surface-dim": "#d9dadb",
                        "inverse-primary": "#adc7ff",
                        "inverse-surface": "#2e3132",
                        "error-container": "#ffdad6",
                        "surface-tint": "#005bc0",
                        "primary-fixed-dim": "#adc7ff",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#414754",
                        "on-primary-fixed-variant": "#004493",
                        "surface-container-high": "#e7e8e9",
                        "secondary-fixed": "#ffdcc2"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ticket-cutout {
            position: relative;
        }
        .ticket-cutout::before,
        .ticket-cutout::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 32px;
            height: 32px;
            background-color: #f5f7fa;
            border-radius: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }
        .ticket-cutout::before {
            left: -16px;
        }
        .ticket-cutout::after {
            right: -16px;
        }
        .dotted-line {
            border-top: 2px dashed #e1e3e4;
            width: 100%;
            margin: 0;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen pb-32">
    <!-- TopAppBar -->
    <header class="fixed top-0 w-full z-50 bg-slate-50/70 backdrop-blur-xl shadow-[0_8px_32px_rgba(0,0,0,0.06)] flex justify-between items-center px-6 py-4">
        <div class="flex items-center gap-3">
            <h1 class="font-headline font-bold text-2xl tracking-tight text-on-surface">My Tickets</h1>
        </div>
        <div class="flex items-center gap-4">
            <button class="material-symbols-outlined text-slate-500 hover:bg-slate-200/50 p-2 rounded-full transition-colors" aria-label="Purchase History">history</button>
        </div>
    </header>

    <main class="pt-24 px-6 max-w-2xl mx-auto space-y-8">
        
        <!-- Tabs -->
        <div class="flex gap-4 p-1 bg-surface-container-high rounded-full">
            <button class="flex-1 bg-white text-primary font-headline font-bold py-2 rounded-full shadow-sm text-sm">Active (1)</button>
            <button class="flex-1 text-on-surface-variant font-headline font-semibold py-2 rounded-full text-sm hover:text-primary transition-colors">Expired</button>
        </div>

        <!-- Active Ticket Card -->
        <section>
            <div class="bg-white rounded-2xl shadow-md border border-surface-container-high overflow-hidden ticket-cutout flex flex-col relative">
                
                <!-- Ticket Header & Branding -->
                <div class="bg-gradient-to-br from-primary to-primary-container p-6 text-white flex justify-between items-start rounded-t-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 opacity-10">
                        <span class="material-symbols-outlined text-[120px] -mt-4 -mr-4" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 mb-1 z-10 relative">
                            <span class="bg-white/20 px-2 py-0.5 rounded text-[10px] uppercase font-bold tracking-wider">AC Metro</span>
                        </div>
                        <h2 class="text-3xl font-headline font-extrabold tracking-tight z-10 relative">Route 402</h2>
                    </div>
                    <div class="text-right z-10 relative">
                        <span class="block text-xs uppercase tracking-widest font-semibold opacity-80">Paid</span>
                        <span class="text-2xl font-headline font-bold">₹40.00</span>
                    </div>
                </div>

                <!-- Ticket Content (Journey Details) -->
                <div class="p-6 pb-8 bg-white relative z-0">
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">From</p>
                            <p class="font-headline font-bold text-lg leading-tight text-on-surface">Majestic<br/>Terminus</p>
                            <p class="text-xs text-on-surface-variant mt-1">11:30 AM</p>
                        </div>
                        
                        <div class="flex flex-col items-center justify-center px-4">
                            <span class="text-[10px] font-semibold text-primary mb-1">45 min</span>
                            <div class="flex items-center w-full">
                                <div class="w-2 h-2 rounded-full bg-primary outline outline-2 outline-primary/30"></div>
                                <div class="h-0.5 w-12 bg-primary/30"></div>
                                <span class="material-symbols-outlined text-primary mx-1 text-sm" style="font-variation-settings: 'FILL' 1;">directions_bus</span>
                                <div class="h-0.5 w-12 bg-primary/30"></div>
                                <div class="w-2 h-2 rounded-full bg-primary outline outline-2 outline-primary/30"></div>
                            </div>
                        </div>

                        <div class="flex-1 text-right">
                            <p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest mb-1">To</p>
                            <p class="font-headline font-bold text-lg leading-tight text-on-surface">Indiranagar<br/>Metro</p>
                            <p class="text-xs text-on-surface-variant mt-1">12:15 PM</p>
                        </div>
                    </div>
                </div>

                <!-- Divider -->
                <div class="w-full relative bg-white h-8 flex items-center justify-center py-4">
                    <div class="dotted-line"></div>
                </div>

                <!-- Ticket QR / Details -->
                <div class="p-6 bg-white rounded-b-2xl flex items-center justify-between">
                    <div>
                        <div class="flex flex-col mb-4">
                            <span class="text-[10px] text-on-surface-variant font-bold uppercase tracking-wider">Passenger</span>
                            <span class="font-headline font-bold text-on-surface">Priyadarshan</span>
                        </div>
                        <div class="flex flex-col mb-4">
                            <span class="text-[10px] text-on-surface-variant font-bold uppercase tracking-wider">Ticket ID</span>
                            <span class="font-headline font-bold text-on-surface">TKT-8930-B</span>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[10px] text-on-surface-variant font-bold uppercase tracking-wider">Date</span>
                            <span class="font-headline font-bold text-on-surface">Today, Oct 24</span>
                        </div>
                    </div>
                    
                    <!-- QR Code Placeholder -->
                    <div class="flex flex-col items-center">
                        <div class="w-28 h-28 bg-white border-2 border-surface-container-high rounded-xl p-2 shadow-sm flex items-center justify-center">
                            <!-- Visual QR code simulation -->
                            <div class="w-full h-full bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPgo8ZGVmcz4KPHBhdHRlcm4gaWQ9InBhdHRlcm4iIHdpZHRoPSI4IiBoZWlnaHQ9IjgiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPgogIDxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiMzMzMiIC8+CiAgPHJlY3QgeD0iNCIgeT0iNCIgd2lkdGg9IjQiIGhlaWdodD0iNCIgZmlsbD0iIzMzMyIgLz4KPC9wYXR0ZXJuPgo8L2RlZnM+CjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjcGF0dGVybikiIC8+Cjwvc3ZnPg==')] opacity-80" style="background-size: 8px;"></div>
                        </div>
                        <span class="text-[10px] font-bold text-primary uppercase tracking-widest mt-2 bg-primary/10 px-2 py-1 rounded-sm">Scan to board</span>
                    </div>
                </div>
            </div>
            
            <button class="w-full py-4 mt-6 rounded-full bg-surface-container-high text-primary font-headline font-bold shadow-sm flex items-center justify-center gap-2 hover:bg-surface-container-highest transition-colors active:scale-95">
                <span class="material-symbols-outlined">download</span>
                Download Ticket
            </button>
        </section>
        
    </main>

    </div>
<!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-3 pb-8 bg-white/70 backdrop-blur-2xl rounded-t-[32px] z-50 shadow-[0_-8px_32px_rgba(0,0,0,0.04)]">
        <button aria-label="Home" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">home</span>
            <span class="font-['Inter'] font-semibold text-[11px] uppercase tracking-wider mt-1">Home</span>
        </button>
        <button aria-label="Nearby" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">near_me</span>
            <span class="font-['Inter'] font-semibold text-[11px] uppercase tracking-wider mt-1">Nearby</span>
        </button>
        <button aria-label="Routes" class="flex flex-col items-center justify-center text-slate-400 px-5 py-2 hover:text-primary transition-colors">
            <span class="material-symbols-outlined">directions_bus</span>
            <span class="font-['Inter'] font-semibold text-[11px] uppercase tracking-wider mt-1">Routes</span>
        </button>
        <button aria-label="Tickets" aria-current="page" class="flex flex-col items-center justify-center bg-gradient-to-br from-primary to-primary-container text-white rounded-full px-5 py-2 transition-all duration-300 shadow-md">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">confirmation_number</span>
            <span class="font-['Inter'] font-semibold text-[11px] uppercase tracking-wider mt-1">Tickets</span>
        </button>
    </nav>
</body>
</html>
